name: Test Ubuntu Wheels

on:
  workflow_call:
    inputs:
      build_run_id:
        description: "Run ID of the build workflow to fetch artifacts from"
        required: true
        type: string
      reuse_test_run_id:
        description: "Existing successful workflow run ID whose test result can be reused"
        required: false
        default: ""
        type: string

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        platform:
          - arch: x86_64
            runner: ubuntu-22.04
            wheel-platform: linux_x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            wheel-platform: linux_aarch64
    name: Test Ubuntu ${{ matrix.platform.arch }} Examples (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    env:
      LWRCLPY_TEST_TIMEOUT_SCALE: "2.0"
    steps:
      - name: Checkout code
        if: ${{ inputs.reuse_test_run_id == '' }}
        uses: actions/checkout@v4

      - name: Checkout submodules
        if: ${{ inputs.reuse_test_run_id == '' }}
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          for attempt in 1 2 3; do
            if git submodule update --init --recursive --depth=1 --jobs=1; then
              exit 0
            fi
            echo "Submodule checkout failed on attempt ${attempt}; retrying..."
            git submodule deinit --all --force || true
          done
          git submodule update --init --recursive --depth=1 --jobs=1

      - name: Set up Python ${{ matrix.python-version }}
        if: ${{ inputs.reuse_test_run_id == '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Download wheel artifact
        if: ${{ inputs.reuse_test_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: wheel-ubuntu-${{ matrix.platform.arch }}-py${{ matrix.python-version }}
          path: downloaded-wheel/
          merge-multiple: false
          run-id: ${{ inputs.build_run_id }}
          repository: ${{ github.repository }}

      - name: Install wheel
        if: ${{ inputs.reuse_test_run_id == '' }}
        run: |
          python -m venv test_venv
          source test_venv/bin/activate
          pip install --upgrade pip
          echo "Available wheels:"
          ls -la downloaded-wheel/
          PYVER=$(python -c 'import sys; print("".join(map(str, sys.version_info[:2])))')
          WHEEL_FILE=$(ls downloaded-wheel/lwrclpy-*-cp${PYVER}-cp${PYVER}-${{ matrix.platform.wheel-platform }}.whl 2>/dev/null | head -n1)
          if [ -z "$WHEEL_FILE" ]; then
            echo "Error: No matching wheel found for Python ${PYVER} ${{ matrix.platform.wheel-platform }}"
            exit 1
          fi
          pip install "$WHEEL_FILE"

      - name: Run unit tests
        if: ${{ inputs.reuse_test_run_id == '' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          source test_venv/bin/activate
          export PYTHONFAULTHANDLER=1
          for test_file in test/test_*.py; do
            case "$(basename "$test_file")" in
              test_examples_*) continue ;;
            esac
            echo "Running unit test $test_file"
            python -u "$test_file" 2>&1 | tee -a test_output.log
            TEST_EXIT_CODE=${PIPESTATUS[0]}
            if [ "$TEST_EXIT_CODE" -ne 0 ]; then
              exit "$TEST_EXIT_CODE"
            fi
          done

      - name: Run example tests
        if: ${{ inputs.reuse_test_run_id == '' }}
        timeout-minutes: 75
        run: |
          set -x
          source test_venv/bin/activate
          export PYTHONFAULTHANDLER=1
          python -u test/test_examples_ubuntu.py 2>&1 | tee -a test_output.log
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          echo "Test exit code: $TEST_EXIT_CODE"
          exit $TEST_EXIT_CODE

      - name: Reuse successful test result
        if: ${{ inputs.reuse_test_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: test-log-ubuntu-${{ matrix.platform.arch }}-py${{ matrix.python-version }}
          path: .
          run-id: ${{ inputs.reuse_test_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-ubuntu-${{ matrix.platform.arch }}-py${{ matrix.python-version }}
          path: test_output.log
          if-no-files-found: ignore
