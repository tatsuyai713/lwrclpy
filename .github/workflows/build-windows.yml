name: Build Windows Wheel

on:
  workflow_call:
    inputs:
      package_version:
        description: "Package version, for example 0.5.1"
        required: false
        default: "0.6.1"
        type: string
      fastdds_python_repos_ref:
        description: "Fast-DDS-python repos ref"
        required: false
        default: "v2.6.1"
        type: string
      reuse_build_run_id:
        description: "Existing workflow run ID to reuse wheel artifacts from"
        required: false
        default: ""
        type: string
    outputs:
      run_id:
        description: "Run ID of the build workflow"
        value: ${{ jobs.post-build.outputs.run_id }}
  workflow_dispatch:
    inputs:
      package_version:
        description: "Package version, for example 0.5.1"
        required: true
        default: "0.6.1"
        type: string
      fastdds_python_repos_ref:
        description: "Fast-DDS-python repos ref"
        required: true
        default: "v2.6.1"
        type: string

jobs:
  validate-packaging-scripts:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up signed Python OpenSSL runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Test OpenSSL runtime selection
        shell: pwsh
        run: scripts/windows/test_openssl_runtime_selection.ps1 -Integration

  build:
    needs: validate-packaging-scripts
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            python-architecture: x64
            vcpkg-triplet: x64-windows
            build-root: C:\lwrclpy_windows_build_x64
            python-version: "3.10"
          - arch: x64
            runner: windows-2025
            python-architecture: x64
            vcpkg-triplet: x64-windows
            build-root: C:\lwrclpy_windows_build_x64
            python-version: "3.11"
          - arch: x64
            runner: windows-2025
            python-architecture: x64
            vcpkg-triplet: x64-windows
            build-root: C:\lwrclpy_windows_build_x64
            python-version: "3.12"
          - arch: x64
            runner: windows-2025
            python-architecture: x64
            vcpkg-triplet: x64-windows
            build-root: C:\lwrclpy_windows_build_x64
            python-version: "3.13"
          - arch: x64
            runner: windows-2025
            python-architecture: x64
            vcpkg-triplet: x64-windows
            build-root: C:\lwrclpy_windows_build_x64
            python-version: "3.14"
          - arch: arm64
            runner: windows-11-arm
            python-architecture: arm64
            vcpkg-triplet: arm64-windows
            build-root: C:\lwrclpy_windows_build_arm64
            python-version: "3.11"
          - arch: arm64
            runner: windows-11-arm
            python-architecture: arm64
            vcpkg-triplet: arm64-windows
            build-root: C:\lwrclpy_windows_build_arm64
            python-version: "3.12"
          - arch: arm64
            runner: windows-11-arm
            python-architecture: arm64
            vcpkg-triplet: arm64-windows
            build-root: C:\lwrclpy_windows_build_arm64
            python-version: "3.13"
          - arch: arm64
            runner: windows-11-arm
            python-architecture: arm64
            vcpkg-triplet: arm64-windows
            build-root: C:\lwrclpy_windows_build_arm64
            python-version: "3.14"
    name: Build Windows ${{ matrix.arch }} Wheel (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Python 3.11 signed OpenSSL runtime
        if: ${{ inputs.reuse_build_run_id == '' && matrix.python-version == '3.10' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "${{ matrix.python-architecture }}"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          architecture: "${{ matrix.python-architecture }}"

      - name: Select preinstalled Java
        if: ${{ inputs.reuse_build_run_id == '' }}
        shell: pwsh
        env:
          LWRCLPY_WINDOWS_BUILD_ARCH: ${{ matrix.arch }}
        run: |
          $javaHomeVariable = if ($env:LWRCLPY_WINDOWS_BUILD_ARCH -eq "arm64") {
            "JAVA_HOME_21_AARCH64"
          } else {
            "JAVA_HOME_21_X64"
          }
          $javaHome = [Environment]::GetEnvironmentVariable($javaHomeVariable)
          if ([string]::IsNullOrWhiteSpace($javaHome) -or -not (Test-Path "$javaHome\bin\java.exe")) {
            throw "The GitHub runner did not provide a usable $javaHomeVariable installation"
          }
          "JAVA_HOME=$javaHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$javaHome\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$javaHome\bin\java.exe" -version
          if ($LASTEXITCODE -ne 0) {
            throw "The preinstalled Java runtime failed with exit code $LASTEXITCODE"
          }

      - name: Restore Fast DDS build cache
        if: ${{ inputs.reuse_build_run_id == '' }}
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.build-root }}\vcpkg
            ${{ matrix.build-root }}\fastdds-prefix
            ${{ matrix.build-root }}\fastddsgen-prefix
          key: lwrclpy-fastdds-${{ runner.os }}-${{ matrix.arch }}-py${{ matrix.python-version }}-${{ matrix.vcpkg-triplet }}-${{ inputs.fastdds_python_repos_ref }}-${{ hashFiles('scripts/windows/install_fastdds_v3_vcpkg.ps1', 'scripts/patch_fastdds_python_loan_helpers.py') }}
          restore-keys: |
            lwrclpy-fastdds-${{ runner.os }}-${{ matrix.arch }}-py${{ matrix.python-version }}-${{ matrix.vcpkg-triplet }}-${{ inputs.fastdds_python_repos_ref }}-

      - name: Install build tools
        if: ${{ inputs.reuse_build_run_id == '' }}
        shell: pwsh
        run: |
          choco install cmake ninja -y --no-progress
          "$env:JAVA_HOME\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          java -version
          python -m pip install --upgrade "swig==4.1.1"
          if ($LASTEXITCODE -ne 0) {
            choco install swig -y --no-progress
          }

      - name: Prepare vcpkg
        if: ${{ inputs.reuse_build_run_id == '' }}
        shell: pwsh
        env:
          LWRCLPY_WINDOWS_BUILD_ROOT: ${{ matrix.build-root }}
          VCPKG_ROOT: ${{ matrix.build-root }}\vcpkg
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.vcpkg-triplet }}
          LWRCLPY_WINDOWS_BUILD_ARCH: ${{ matrix.arch }}
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
            if (-not (Test-Path "$env:VCPKG_ROOT")) {
              git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
            }
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          } elseif (Test-Path "$env:VCPKG_ROOT\.git") {
            git -C "$env:VCPKG_ROOT" pull --ff-only
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          }
          "VCPKG_ROOT=$env:VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LWRCLPY_WINDOWS_BUILD_ARCH=$env:LWRCLPY_WINDOWS_BUILD_ARCH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows wheel
        if: ${{ inputs.reuse_build_run_id == '' }}
        shell: pwsh
        env:
          PKG_VERSION: ${{ inputs.package_version }}
          FASTDDS_PYTHON_REPOS_REF: ${{ inputs.fastdds_python_repos_ref }}
          LWRCLPY_WINDOWS_BUILD_ROOT: ${{ matrix.build-root }}
          FASTDDS_PREFIX: ${{ matrix.build-root }}\fastdds-prefix
          FASTDDSGEN_PREFIX: ${{ matrix.build-root }}\fastddsgen-prefix
          FASTDDS_WS: ${{ matrix.build-root }}\fastdds-workspace
          BUILD_ROOT: ${{ matrix.build-root }}\generated-types
          VCPKG_ROOT: ${{ matrix.build-root }}\vcpkg
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.vcpkg-triplet }}
          LWRCLPY_WINDOWS_BUILD_ARCH: ${{ matrix.arch }}
          LWRCLPY_USE_FASTDDS_CACHE: "1"
          JOBS: "2"
        run: |
          scripts/windows/build_all.ps1 `
            -PackageVersion "$env:PKG_VERSION" `
            -Prefix "$env:FASTDDS_PREFIX" `
            -GenPrefix "$env:FASTDDSGEN_PREFIX" `
            -Workspace "$env:FASTDDS_WS" `
            -BuildRoot "$env:BUILD_ROOT" `
            -VcpkgRoot "$env:VCPKG_ROOT" `
            -VcpkgTriplet "$env:VCPKG_DEFAULT_TRIPLET" `
            -BuildArch "$env:LWRCLPY_WINDOWS_BUILD_ARCH" `
            -Jobs 2

      - name: Reuse wheel artifact
        if: ${{ inputs.reuse_build_run_id != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path wheelhouse -Force | Out-Null
          gh run download "${{ inputs.reuse_build_run_id }}" `
            --repo "$env:GITHUB_REPOSITORY" `
            --name "wheel-windows-${{ matrix.arch }}-py${{ matrix.python-version }}" `
            --dir wheelhouse
          python scripts\overlay_python_sources_into_wheel.py (Get-ChildItem wheelhouse -Filter "lwrclpy-*.whl").FullName --source-root .

      - name: Upload repaired wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-${{ matrix.arch }}-py${{ matrix.python-version }}
          path: wheelhouse/*.whl
          retention-days: 30

  post-build:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_id: ${{ steps.run_id.outputs.run_id }}
    steps:
      - name: Export run id
        id: run_id
        run: |
          echo "run_id=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
