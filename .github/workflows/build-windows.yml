name: Build Windows Wheel

on:
  workflow_call:
    inputs:
      package_version:
        description: "Package version, for example 0.5.1"
        required: false
        default: "0.5.1"
        type: string
      fastdds_python_repos_ref:
        description: "Fast-DDS-python repos ref"
        required: false
        default: "v2.6.1"
        type: string
    outputs:
      run_id:
        description: "Run ID of the build workflow"
        value: ${{ jobs.post-build.outputs.run_id }}
  workflow_dispatch:
    inputs:
      package_version:
        description: "Package version, for example 0.5.1"
        required: true
        default: "0.5.1"
        type: string
      fastdds_python_repos_ref:
        description: "Fast-DDS-python repos ref"
        required: true
        default: "v2.6.1"
        type: string

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build tools
        shell: pwsh
        run: |
          choco install cmake ninja -y --no-progress
          "$env:JAVA_HOME\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          java -version
          python -m pip install --upgrade "swig==4.1.1"

      - name: Prepare vcpkg
        shell: pwsh
        env:
          LWRCLPY_WINDOWS_BUILD_ROOT: C:\lwrclpy_windows_build
          VCPKG_ROOT: C:\lwrclpy_windows_build\vcpkg
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
            if (-not (Test-Path "$env:VCPKG_ROOT")) {
              git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
            }
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          } elseif (Test-Path "$env:VCPKG_ROOT\.git") {
            git -C "$env:VCPKG_ROOT" pull --ff-only
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          }
          "VCPKG_ROOT=$env:VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows wheel
        shell: pwsh
        env:
          PKG_VERSION: ${{ inputs.package_version }}
          FASTDDS_PYTHON_REPOS_REF: ${{ inputs.fastdds_python_repos_ref }}
          LWRCLPY_WINDOWS_BUILD_ROOT: C:\lwrclpy_windows_build
          FASTDDS_PREFIX: C:\lwrclpy_windows_build\fastdds-prefix
          FASTDDSGEN_PREFIX: C:\lwrclpy_windows_build\fastddsgen-prefix
          FASTDDS_WS: C:\lwrclpy_windows_build\fastdds-workspace
          BUILD_ROOT: C:\lwrclpy_windows_build\generated-types
          VCPKG_ROOT: C:\lwrclpy_windows_build\vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-windows
          JOBS: "2"
        run: |
          scripts/windows/build_all.ps1 `
            -PackageVersion "$env:PKG_VERSION" `
            -Prefix "$env:FASTDDS_PREFIX" `
            -GenPrefix "$env:FASTDDSGEN_PREFIX" `
            -Workspace "$env:FASTDDS_WS" `
            -BuildRoot "$env:BUILD_ROOT" `
            -VcpkgRoot "$env:VCPKG_ROOT" `
            -VcpkgTriplet "$env:VCPKG_DEFAULT_TRIPLET" `
            -Jobs 2

      - name: Upload repaired wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-py${{ matrix.python-version }}
          path: wheelhouse/*.whl
          retention-days: 30

  post-build:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_id: ${{ steps.run_id.outputs.run_id }}
    steps:
      - name: Export run id
        id: run_id
        run: |
          echo "run_id=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
