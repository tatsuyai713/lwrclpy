name: Test macOS Wheels

on:
  workflow_call:
    inputs:
      build_run_id:
        description: "Run ID of the build workflow to fetch artifacts from"
        required: true
        type: string

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    name: Test macOS (Python ${{ matrix.python-version }})
    runs-on: macos-15
    timeout-minutes: 90
    env:
      LWRCLPY_TEST_TIMEOUT_SCALE: "2.0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          for attempt in 1 2 3; do
            if git submodule update --init --recursive --depth=1 --jobs=1; then
              exit 0
            fi
            echo "Submodule checkout failed on attempt ${attempt}; retrying..."
            git submodule deinit --all --force || true
          done
          git submodule update --init --recursive --depth=1 --jobs=1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel-macos-py${{ matrix.python-version }}
          path: downloaded-wheel/
          merge-multiple: false
          run-id: ${{ inputs.build_run_id }}
          repository: ${{ github.repository }}

      - name: Install wheel
        run: |
          python -m venv test_venv
          source test_venv/bin/activate
          pip install --upgrade pip
          echo "Available wheels:"
          ls -la downloaded-wheel/
          PYVER=$(python -c 'import sys; print("".join(map(str, sys.version_info[:2])))')
          pip install downloaded-wheel/lwrclpy-*-cp${PYVER}-cp${PYVER}-macosx_15_*.whl

      - name: Run unit tests
        timeout-minutes: 15
        run: |
          set -euo pipefail
          source test_venv/bin/activate
          export PYTHONFAULTHANDLER=1
          for test_file in test/test_*.py; do
            case "$(basename "$test_file")" in
              test_examples_*) continue ;;
            esac
            echo "Running unit test $test_file"
            python -u "$test_file" 2>&1 | tee -a test_output.log
            TEST_EXIT_CODE=${PIPESTATUS[0]}
            if [ "$TEST_EXIT_CODE" -ne 0 ]; then
              exit "$TEST_EXIT_CODE"
            fi
          done

      - name: Run example tests
        timeout-minutes: 75
        run: |
          set -x
          source test_venv/bin/activate
          export PYTHONFAULTHANDLER=1
          python -u test/test_examples_mac.py 2>&1 | tee -a test_output.log
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          echo "Test exit code: $TEST_EXIT_CODE"
          exit $TEST_EXIT_CODE

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-macos-py${{ matrix.python-version }}
          path: test_output.log
          if-no-files-found: ignore
