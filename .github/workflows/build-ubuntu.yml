name: Build Ubuntu Wheels

on:
  workflow_call:
    inputs:
      reuse_build_run_id:
        description: "Existing workflow run ID to reuse wheel artifacts from"
        required: false
        default: ""
        type: string
    outputs:
      run_id:
        description: "Run ID of the build workflow"
        value: ${{ jobs.post-build.outputs.run_id }}

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        platform:
          - arch: x86_64
            runner: ubuntu-22.04
            build-jobs: 4
          - arch: aarch64
            runner: ubuntu-24.04-arm
            build-jobs: 2
    name: Build Ubuntu ${{ matrix.platform.arch }} Wheel (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 150
    steps:
      - name: Checkout code
        if: ${{ inputs.reuse_build_run_id == '' }}
        uses: actions/checkout@v4

      - name: Checkout submodules
        if: ${{ inputs.reuse_build_run_id == '' }}
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          for attempt in 1 2 3; do
            if git submodule update --init --recursive --depth=1 --jobs=1; then
              exit 0
            fi
            echo "Submodule checkout failed on attempt ${attempt}; retrying..."
            git submodule deinit --all --force || true
          done
          git submodule update --init --recursive --depth=1 --jobs=1

      - name: Set up Python ${{ matrix.python-version }}
        if: ${{ inputs.reuse_build_run_id == '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip

      - name: Restore Fast DDS build cache
        if: ${{ inputs.reuse_build_run_id == '' }}
        uses: actions/cache@v4
        with:
          path: |
            .lwrclpy-cache/fast-dds-v3
            .lwrclpy-cache/fast-dds-gen-v3
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: lwrclpy-fastdds-${{ runner.os }}-${{ matrix.platform.arch }}-py${{ matrix.python-version }}-${{ hashFiles('scripts/install_fastdds_v3_colcon.sh', 'scripts/patch_fastdds_python_loan_helpers.py') }}
          restore-keys: |
            lwrclpy-fastdds-${{ runner.os }}-${{ matrix.platform.arch }}-py${{ matrix.python-version }}-

      - name: Install system dependencies
        if: ${{ inputs.reuse_build_run_id == '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            wget \
            libasio-dev \
            libtinyxml2-dev \
            libssl-dev \
            swig \
            patchelf

      - name: Create virtual environment
        if: ${{ inputs.reuse_build_run_id == '' }}
        run: |
          python -m venv build_venv
          source build_venv/bin/activate
          python -m pip install --upgrade pip wheel setuptools

      - name: Install FastDDS v3, Generate Python types, and Build wheel
        if: ${{ inputs.reuse_build_run_id == '' }}
        run: |
          source build_venv/bin/activate
          export PREFIX_V3="${GITHUB_WORKSPACE}/.lwrclpy-cache/fast-dds-v3"
          export GEN_PREFIX="${GITHUB_WORKSPACE}/.lwrclpy-cache/fast-dds-gen-v3"
          export WS="${GITHUB_WORKSPACE}/.lwrclpy-cache/fastdds_python_ws"
          export LWRCLPY_USE_FASTDDS_CACHE=1
          bash scripts/install_fastdds_v3_colcon.sh
          export PATH="${GEN_PREFIX}/bin:$PATH"
          export FASTDDSGEN_BIN="${GEN_PREFIX}/bin/fastddsgen"
          export JOBS="${{ matrix.platform.build-jobs }}"
          export CMAKE_PREFIX_PATH="${PREFIX_V3}:${CMAKE_PREFIX_PATH:-}"
          export LD_LIBRARY_PATH="${PREFIX_V3}/lib:${PREFIX_V3}/lib64:${LD_LIBRARY_PATH:-}"
          export PYTHONPATH="${PREFIX_V3}/lib/python$(python -c 'import sys;print("{}.{}".format(*sys.version_info[:2]))')/site-packages:${PYTHONPATH:-}"
          cd scripts && bash gen_python_types.sh
          cd ..
          rm -rf dist/
          bash scripts/make_pip_package_with_runtime.sh

      - name: Reuse wheel artifact
        if: ${{ inputs.reuse_build_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: wheel-ubuntu-${{ matrix.platform.arch }}-py${{ matrix.python-version }}
          path: dist/
          run-id: ${{ inputs.reuse_build_run_id }}
          repository: ${{ github.repository }}

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-ubuntu-${{ matrix.platform.arch }}-py${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 30

  post-build:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_id: ${{ steps.run_id.outputs.run_id }}
    steps:
      - name: Export run id
        id: run_id
        run: |
          echo "run_id=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
