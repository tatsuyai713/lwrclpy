name: Test Windows Wheels

on:
  workflow_call:
    inputs:
      build_run_id:
        description: "Run ID of the build workflow to fetch artifacts from"
        required: true
        type: string

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    name: Test Windows (Python ${{ matrix.python-version }})
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      LWRCLPY_TEST_PLATFORM: Windows
      LWRCLPY_TEST_TIMEOUT_SCALE: "2.0"
      LWRCLPY_TEST_USE_INSTALLED: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout submodules
        shell: pwsh
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          foreach ($attempt in 1..3) {
            git submodule update --init --recursive --depth=1 --jobs=1
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            Write-Host "Submodule checkout failed on attempt $attempt; retrying..."
            git submodule deinit --all --force
          }
          git submodule update --init --recursive --depth=1 --jobs=1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel-windows-py${{ matrix.python-version }}
          path: downloaded-wheel/
          merge-multiple: false
          run-id: ${{ inputs.build_run_id }}
          repository: ${{ github.repository }}

      - name: Install wheel
        shell: pwsh
        run: |
          python -m venv test_venv
          .\test_venv\Scripts\python.exe -m pip install --upgrade pip
          Write-Host "Available wheels:"
          Get-ChildItem downloaded-wheel
          $pyver = .\test_venv\Scripts\python.exe -c "import sys; print(''.join(map(str, sys.version_info[:2])))"
          $wheel = Get-ChildItem downloaded-wheel -Filter "lwrclpy-*-cp$pyver-cp$pyver-win_amd64.whl" | Select-Object -First 1
          if (-not $wheel) {
            throw "Windows wheel for cp$pyver not found"
          }
          .\test_venv\Scripts\python.exe -m pip install $wheel.FullName

      - name: Run tests
        shell: pwsh
        timeout-minutes: 75
        run: |
          .\test_venv\Scripts\python.exe -u test\test_examples_windows.py 2>&1 | Tee-Object -FilePath test_output.log
          if ($LASTEXITCODE -ne 0) {
            throw "Windows example tests failed with exit code $LASTEXITCODE"
          }
