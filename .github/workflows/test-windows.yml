name: Test Windows Wheels

on:
  workflow_call:
    inputs:
      build_run_id:
        description: "Run ID of the build workflow to fetch artifacts from"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run ID of the build workflow to fetch artifacts from"
        required: true
        type: string

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            python-architecture: x64
            python-version: "3.10"
          - arch: x64
            runner: windows-2022
            python-architecture: x64
            python-version: "3.11"
          - arch: x64
            runner: windows-2022
            python-architecture: x64
            python-version: "3.12"
          - arch: x64
            runner: windows-2022
            python-architecture: x64
            python-version: "3.13"
          - arch: x64
            runner: windows-2022
            python-architecture: x64
            python-version: "3.14"
          - arch: arm64
            runner: windows-11-arm
            python-architecture: arm64
            python-version: "3.11"
          - arch: arm64
            runner: windows-11-arm
            python-architecture: arm64
            python-version: "3.12"
          - arch: arm64
            runner: windows-11-arm
            python-architecture: arm64
            python-version: "3.13"
          - arch: arm64
            runner: windows-11-arm
            python-architecture: arm64
            python-version: "3.14"
    name: Test Windows ${{ matrix.arch }} Examples (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      LWRCLPY_TEST_TIMEOUT_SCALE: "2.0"
      LWRCLPY_TEST_PLATFORM: "Windows"
      LWRCLPY_TEST_USE_INSTALLED: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          architecture: "${{ matrix.python-architecture }}"

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel-windows-${{ matrix.arch }}-py${{ matrix.python-version }}
          path: downloaded-wheel/
          merge-multiple: false
          run-id: ${{ inputs.build_run_id }}
          repository: ${{ github.repository }}

      - name: Install wheel
        shell: pwsh
        run: |
          python -m venv test_venv
          .\test_venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          Write-Host "Available wheels:"
          Get-ChildItem downloaded-wheel
          $wheel = Get-ChildItem downloaded-wheel -Filter "lwrclpy-*.whl" | Select-Object -First 1
          if ($null -eq $wheel) {
            Write-Error "No lwrclpy wheel found"
            exit 1
          }
          python -m pip install $wheel.FullName

      - name: Run unit tests
        shell: pwsh
        timeout-minutes: 15
        run: |
          .\test_venv\Scripts\Activate.ps1
          $env:PYTHONFAULTHANDLER = "1"
          $unitTests = Get-ChildItem test -Filter "test_*.py" |
            Where-Object { $_.Name -notlike "test_examples_*" } |
            Sort-Object Name
          foreach ($testFile in $unitTests) {
            Write-Host "Running unit test $($testFile.FullName)"
            python -u $testFile.FullName 2>&1 | Tee-Object -FilePath test_output.log -Append
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Run example tests
        shell: pwsh
        timeout-minutes: 75
        run: |
          .\test_venv\Scripts\Activate.ps1
          $env:PYTHONFAULTHANDLER = "1"
          python -u test/test_examples_windows.py 2>&1 | Tee-Object -FilePath test_output.log -Append
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-windows-${{ matrix.arch }}-py${{ matrix.python-version }}
          path: test_output.log
          if-no-files-found: ignore
