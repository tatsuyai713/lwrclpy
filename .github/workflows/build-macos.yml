name: Build macOS Wheels

on:
  workflow_call:
    outputs:
      run_id:
        description: "Run ID of the build workflow"
        value: ${{ jobs.post-build.outputs.run_id }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    name: Build macOS Wheel (Python ${{ matrix.python-version }})
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          for attempt in 1 2 3; do
            if git submodule update --init --recursive --depth=1 --jobs=1; then
              exit 0
            fi
            echo "Submodule checkout failed on attempt ${attempt}; retrying..."
            git submodule deinit --all --force || true
          done
          git submodule update --init --recursive --depth=1 --jobs=1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip

      - name: Restore Fast DDS build cache
        uses: actions/cache@v4
        with:
          path: |
            .lwrclpy-cache/fast-dds-v3
            .lwrclpy-cache/fast-dds-gen-v3
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: lwrclpy-fastdds-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('scripts/mac/mac_install_fastdds_v3_colcon.sh', 'scripts/patch_fastdds_python_loan_helpers.py') }}
          restore-keys: |
            lwrclpy-fastdds-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install system dependencies
        run: |
          brew install \
            cmake \
            asio \
            tinyxml2 \
            openssl@3 \
            swig

      - name: Create virtual environment
        run: |
          python -m venv build_venv
          source build_venv/bin/activate
          python -m pip install --upgrade pip wheel setuptools

      - name: Install FastDDS v3, Generate Python types, and Build wheel
        run: |
          source build_venv/bin/activate
          export PREFIX_V3="${GITHUB_WORKSPACE}/.lwrclpy-cache/fast-dds-v3"
          export GEN_PREFIX="${GITHUB_WORKSPACE}/.lwrclpy-cache/fast-dds-gen-v3"
          export WS="${GITHUB_WORKSPACE}/.lwrclpy-cache/fastdds_python_ws"
          export LWRCLPY_USE_FASTDDS_CACHE=1
          bash scripts/mac/mac_install_fastdds_v3_colcon.sh
          export PATH="${GEN_PREFIX}/bin:$PATH"
          export FASTDDSGEN_BIN="${GEN_PREFIX}/bin/fastddsgen"
          export CMAKE_PREFIX_PATH="${PREFIX_V3}:${CMAKE_PREFIX_PATH:-}"
          export DYLD_LIBRARY_PATH="${PREFIX_V3}/lib:${PREFIX_V3}/lib64:${DYLD_LIBRARY_PATH:-}"
          export PYTHONPATH="${PREFIX_V3}/lib/python$(python -c 'import sys;print("{}.{}".format(*sys.version_info[:2]))')/site-packages:${PYTHONPATH:-}"
          cd scripts/mac && bash mac_gen_python_types.sh
          cd ../..
          rm -rf dist/
          bash scripts/mac/mac_make_pip_package_with_runtime.sh

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-py${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 30

  post-build:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_id: ${{ steps.run_id.outputs.run_id }}
    steps:
      - name: Export run id
        id: run_id
        run: |
          echo "run_id=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
