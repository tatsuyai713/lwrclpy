name: Build, Test & Release Wheels

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create or replace"
        required: false
        type: string
      reuse_build_run_id:
        description: "Existing workflow run ID to reuse wheel artifacts from"
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  resolve-build-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reuse_build_run_id: ${{ steps.resolve.outputs.reuse_build_run_id }}
    steps:
      - name: Resolve reusable build artifacts
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDED_REUSE_BUILD_RUN_ID: ${{ inputs.reuse_build_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$PROVIDED_REUSE_BUILD_RUN_ID" ]; then
            echo "Using provided build run: $PROVIDED_REUSE_BUILD_RUN_ID"
            echo "reuse_build_run_id=$PROVIDED_REUSE_BUILD_RUN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          reuse_run_id=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || [ -n "$RELEASE_TAG" ]; then
            workflow_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows" \
              --jq '.workflows[] | select(.path == ".github/workflows/ci.yml") | .id' \
              | head -n 1)"
            reuse_run_id="$(gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs" \
              -f head_sha="$GITHUB_SHA" \
              -f status=success \
              -f per_page=20 \
              --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0].id // ""')"
          fi

          if [ -n "$reuse_run_id" ]; then
            echo "Found reusable successful build run for $GITHUB_SHA: $reuse_run_id"
          else
            echo "No reusable successful build run found for $GITHUB_SHA"
          fi
          echo "reuse_build_run_id=$reuse_run_id" >> "$GITHUB_OUTPUT"

  build-ubuntu-wheels:
    needs: resolve-build-artifacts
    uses: ./.github/workflows/build-ubuntu.yml
    with:
      reuse_build_run_id: ${{ needs.resolve-build-artifacts.outputs.reuse_build_run_id }}

  build-macos-wheels:
    needs: resolve-build-artifacts
    uses: ./.github/workflows/build-macos.yml
    with:
      reuse_build_run_id: ${{ needs.resolve-build-artifacts.outputs.reuse_build_run_id }}

  build-windows-wheels:
    needs: resolve-build-artifacts
    uses: ./.github/workflows/build-windows.yml
    with:
      reuse_build_run_id: ${{ needs.resolve-build-artifacts.outputs.reuse_build_run_id }}

  test-ubuntu-wheels:
    needs: build-ubuntu-wheels
    uses: ./.github/workflows/test-ubuntu.yml
    with:
      build_run_id: ${{ needs.build-ubuntu-wheels.outputs.run_id }}

  test-macos-wheels:
    needs: build-macos-wheels
    uses: ./.github/workflows/test-macos.yml
    with:
      build_run_id: ${{ needs.build-macos-wheels.outputs.run_id }}

  test-windows-wheels:
    needs: build-windows-wheels
    uses: ./.github/workflows/test-windows.yml
    with:
      build_run_id: ${{ needs.build-windows-wheels.outputs.run_id }}

  release-wheels:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
    needs:
      - test-ubuntu-wheels
      - test-macos-wheels
      - test-windows-wheels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: all-wheels/
          merge-multiple: true

      - name: List wheels
        run: ls -la all-wheels/

      - name: Create or replace release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
            IS_LATEST="false"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            IS_LATEST="false"
          else
            TAG="latest"
            IS_LATEST="true"
          fi
          echo "Release tag: $TAG"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading wheel assets with --clobber ..."
            gh release upload "$TAG" all-wheels/*.whl \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            echo "Creating release $TAG ..."
            if [ "$IS_LATEST" = "true" ]; then
              gh release create "$TAG" all-wheels/*.whl \
                --repo "$GITHUB_REPOSITORY" \
                --title "Latest Build" \
                --prerelease \
                --notes "Automated build from \`main\` branch ($(date -u +%Y-%m-%d\ %H:%M\ UTC))"
            else
              gh release create "$TAG" all-wheels/*.whl \
                --repo "$GITHUB_REPOSITORY" \
                --title "$TAG" \
                --generate-notes
            fi
          fi
