name: Build, Test & Release Wheels

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform workflows to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - ubuntu
          - macos
          - windows
      release_tag:
        description: "Release tag to create or replace"
        required: false
        type: string
      reuse_build_run_id:
        description: "Existing workflow run ID to reuse wheel artifacts from"
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: wheel-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  detect-platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      all: ${{ steps.platforms.outputs.all }}
      ubuntu: ${{ steps.platforms.outputs.ubuntu }}
      macos: ${{ steps.platforms.outputs.macos }}
      windows: ${{ steps.platforms.outputs.windows }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select affected platforms
        id: platforms
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUESTED_PLATFORM: ${{ inputs.platform }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$REQUESTED_PLATFORM" in
              ubuntu) scripts/ci/select_platforms.sh .github/workflows/build-ubuntu.yml ;;
              macos) scripts/ci/select_platforms.sh .github/workflows/build-macos.yml ;;
              windows) scripts/ci/select_platforms.sh .github/workflows/build-windows.yml ;;
              all) scripts/ci/select_platforms.sh --all ;;
              *) echo "Unsupported platform selection: $REQUESTED_PLATFORM" >&2; exit 1 ;;
            esac | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            scripts/ci/select_platforms.sh --all | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            diff_base="$BASE_SHA"
          else
            diff_base="$BEFORE_SHA"
          fi

          if [[ -z "$diff_base" || "$diff_base" =~ ^0+$ ]] || ! git cat-file -e "${diff_base}^{commit}" 2>/dev/null; then
            scripts/ci/select_platforms.sh --all | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -d '' -t changed_files < <(git diff --name-only -z "$diff_base" "$GITHUB_SHA")
          printf 'Changed file: %s\n' "${changed_files[@]}"
          scripts/ci/select_platforms.sh "${changed_files[@]}" | tee -a "$GITHUB_OUTPUT"

  resolve-build-artifacts:
    needs: detect-platforms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ubuntu_reuse_run_id: ${{ steps.resolve.outputs.ubuntu_reuse_run_id }}
      macos_reuse_run_id: ${{ steps.resolve.outputs.macos_reuse_run_id }}
      windows_reuse_run_id: ${{ steps.resolve.outputs.windows_reuse_run_id }}
    steps:
      - name: Checkout CI helpers
        uses: actions/checkout@v4

      - name: Resolve reusable build artifacts
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDED_REUSE_BUILD_RUN_ID: ${{ inputs.reuse_build_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RUN_UBUNTU: ${{ needs.detect-platforms.outputs.ubuntu }}
          RUN_MACOS: ${{ needs.detect-platforms.outputs.macos }}
          RUN_WINDOWS: ${{ needs.detect-platforms.outputs.windows }}
        run: |
          if [ -n "$PROVIDED_REUSE_BUILD_RUN_ID" ]; then
            echo "Using provided build run: $PROVIDED_REUSE_BUILD_RUN_ID"
            echo "ubuntu_reuse_run_id=$PROVIDED_REUSE_BUILD_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "macos_reuse_run_id=$PROVIDED_REUSE_BUILD_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "windows_reuse_run_id=$PROVIDED_REUSE_BUILD_RUN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          reuse_run_id=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || [ -n "$RELEASE_TAG" ]; then
            workflow_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows" \
              --jq '.workflows[] | select(.path == ".github/workflows/ci.yml") | .id' \
              | head -n 1)"
            reuse_run_id="$(gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs" \
              -f head_sha="$GITHUB_SHA" \
              -f status=success \
              -f per_page=20 \
              --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0].id // ""')"
          fi

          if [ -n "$reuse_run_id" ]; then
            echo "Found reusable successful build run for $GITHUB_SHA: $reuse_run_id"
            ubuntu_reuse_run_id="$reuse_run_id"
            macos_reuse_run_id="$reuse_run_id"
            windows_reuse_run_id="$reuse_run_id"
          else
            ubuntu_reuse_run_id=""
            macos_reuse_run_id=""
            windows_reuse_run_id=""

            if [ "$RUN_UBUNTU" != "true" ]; then
              ubuntu_reuse_run_id="$(scripts/ci/find_reusable_run.sh ubuntu "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
            fi
            if [ "$RUN_MACOS" != "true" ]; then
              macos_reuse_run_id="$(scripts/ci/find_reusable_run.sh macos "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
            fi
            if [ "$RUN_WINDOWS" != "true" ]; then
              windows_reuse_run_id="$(scripts/ci/find_reusable_run.sh windows "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
            fi
          fi
          echo "ubuntu_reuse_run_id=$ubuntu_reuse_run_id" >> "$GITHUB_OUTPUT"
          echo "macos_reuse_run_id=$macos_reuse_run_id" >> "$GITHUB_OUTPUT"
          echo "windows_reuse_run_id=$windows_reuse_run_id" >> "$GITHUB_OUTPUT"
          echo "Ubuntu reuse run: ${ubuntu_reuse_run_id:-none}"
          echo "macOS reuse run: ${macos_reuse_run_id:-none}"
          echo "Windows reuse run: ${windows_reuse_run_id:-none}"

  build-ubuntu-wheels:
    needs:
      - detect-platforms
      - resolve-build-artifacts
    uses: ./.github/workflows/build-ubuntu.yml
    with:
      reuse_build_run_id: ${{ needs.resolve-build-artifacts.outputs.ubuntu_reuse_run_id }}

  build-macos-wheels:
    needs:
      - detect-platforms
      - resolve-build-artifacts
    uses: ./.github/workflows/build-macos.yml
    with:
      reuse_build_run_id: ${{ needs.resolve-build-artifacts.outputs.macos_reuse_run_id }}

  build-windows-wheels:
    needs:
      - detect-platforms
      - resolve-build-artifacts
    uses: ./.github/workflows/build-windows.yml
    with:
      reuse_build_run_id: ${{ needs.resolve-build-artifacts.outputs.windows_reuse_run_id }}

  test-ubuntu-wheels:
    needs:
      - build-ubuntu-wheels
      - resolve-build-artifacts
    uses: ./.github/workflows/test-ubuntu.yml
    with:
      build_run_id: ${{ needs.build-ubuntu-wheels.outputs.run_id }}
      reuse_test_run_id: ${{ needs.resolve-build-artifacts.outputs.ubuntu_reuse_run_id }}

  test-macos-wheels:
    needs:
      - build-macos-wheels
      - resolve-build-artifacts
    uses: ./.github/workflows/test-macos.yml
    with:
      build_run_id: ${{ needs.build-macos-wheels.outputs.run_id }}
      reuse_test_run_id: ${{ needs.resolve-build-artifacts.outputs.macos_reuse_run_id }}

  test-windows-wheels:
    needs:
      - build-windows-wheels
      - resolve-build-artifacts
    uses: ./.github/workflows/test-windows.yml
    with:
      build_run_id: ${{ needs.build-windows-wheels.outputs.run_id }}
      reuse_test_run_id: ${{ needs.resolve-build-artifacts.outputs.windows_reuse_run_id }}

  release-wheels:
    if: >-
      ${{
        always() &&
        needs.test-ubuntu-wheels.result == 'success' &&
        needs.test-macos-wheels.result == 'success' &&
        needs.test-windows-wheels.result == 'success' &&
        github.event_name != 'pull_request' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
      }}
    needs:
      - detect-platforms
      - test-ubuntu-wheels
      - test-macos-wheels
      - test-windows-wheels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: all-wheels/
          merge-multiple: true

      - name: List wheels
        run: ls -la all-wheels/

      - name: Create or replace release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
            IS_LATEST="false"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            IS_LATEST="false"
          else
            TAG="latest"
            IS_LATEST="true"
          fi
          echo "Release tag: $TAG"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading wheel assets with --clobber ..."
            gh release upload "$TAG" all-wheels/*.whl \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            echo "Creating release $TAG ..."
            if [ "$IS_LATEST" = "true" ]; then
              gh release create "$TAG" all-wheels/*.whl \
                --repo "$GITHUB_REPOSITORY" \
                --title "Latest Build" \
                --prerelease \
                --notes "Automated build from \`main\` branch ($(date -u +%Y-%m-%d\ %H:%M\ UTC))"
            else
              gh release create "$TAG" all-wheels/*.whl \
                --repo "$GITHUB_REPOSITORY" \
                --title "$TAG" \
                --generate-notes
            fi
          fi
